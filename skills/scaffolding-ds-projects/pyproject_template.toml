# Template — ajuste nome, descrição e dependências ao projeto.
# Inclua apenas as bibliotecas realmente usadas.

[project]
name = "project-name"
version = "0.1.0"
description = "Descrição curta do projeto"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "polars>=1.9",
    "pyarrow>=17.0",
    "pandera[polars]>=0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "rich>=13.8",
    "scikit-learn>=1.5",
    "mlflow>=2.16",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "basedpyright>=1.18",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "pre-commit>=3.8",
    "commitizen>=3.29",
]
quality = [
    "bandit[toml]>=1.7",
    "vulture>=2.13",
    "refurb>=2.0",
    "xenon>=0.9",
    "radon>=6.0",
    "interrogate>=1.7",
    "pip-audit>=2.7",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[tool.uv]
package = false  # aplicação, não biblioteca; código em src/ via pythonpath
default-groups = ["dev"]

# ---------------- ruff ----------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PTH", "RUF", "S", "D", "NPY", "PD", "PL"]
ignore = ["D203", "D213", "PLR0913"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004"]

# ------------- basedpyright -------------
[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

# ---------------- pytest ----------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "smoke: testes rápidos (< 10 s) usados no pre-commit",
    "slow: testes lentos (treino, integração)",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

# ------------- qualidade (CI) -------------
[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.vulture]
paths = ["src"]
min_confidence = 80

[tool.interrogate]
fail-under = 90
exclude = ["tests"]

# ---------------- commitizen ----------------
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
